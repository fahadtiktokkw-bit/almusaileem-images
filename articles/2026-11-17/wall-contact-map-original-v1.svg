<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>خريطة احتكاك الجدران</title><desc>رسم تخطيطي لغرفة ومدخل يوضح مواقع احتكاك كرسي وحقيبة وأثاث بالجدران.</desc><rect width="1200" height="800" fill="#f4f1ea"/><rect x="45" y="45" width="1110" height="710" rx="30" fill="#fff"/><text x="600" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#253e46">خريطة احتكاك البيت</text><text x="600" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#627176">حدد موضع العلامة قبل ما تحدد الإصلاح</text><path d="M130 230H820V650H500V560H130Z" fill="#f2e8d9" stroke="#253e46" stroke-width="15"/><path d="M500 650H650" stroke="#fff" stroke-width="18"/><path d="M650 650V505M500 650Q500 505 650 505" fill="none" stroke="#9eaaa6" stroke-width="3"/><rect x="195" y="305" width="200" height="140" rx="20" fill="#b5c6bd" stroke="#668077" stroke-width="4"/><rect x="242" y="248" width="105" height="48" rx="12" fill="#c7a982" stroke="#9d805e" stroke-width="4"/><path d="M245 295V305M344 295V305" stroke="#9d805e" stroke-width="7"/><rect x="670" y="280" width="104" height="250" rx="14" fill="#d5c2a6" stroke="#a08b70" stroke-width="4"/><path d="M722 280V530" stroke="#b59a78" stroke-width="3"/><rect x="548" y="555" width="65" height="75" rx="18" fill="#6b8793"/><path d="M563 555V540Q580 519 598 540V555" fill="none" stroke="#6b8793" stroke-width="7"/><path d="M560 596H601" stroke="#a8bcc4" stroke-width="4"/><g fill="#e8a078" fill-opacity=".3" stroke="#ce6d48" stroke-width="3"><circle cx="294" cy="234" r="31"/><circle cx="804" cy="410" r="31"/><circle cx="505" cy="590" r="31"/></g><g stroke="#ce6d48" fill="none" stroke-width="3"><path d="M295 234L355 205H920"/><path d="M804 410H920"/><path d="M505 590L850 610H920"/></g><g font-family="Arial,sans-serif" font-size="25" fill="#253e46" text-anchor="end"><text x="1080" y="215">كرسي السفرة</text><text x="1080" y="420">زاوية الأثاث</text><text x="1080" y="620">شنط المدخل</text></g><text x="300" y="493" font-family="Arial,sans-serif" text-anchor="middle" font-size="24" fill="#627176">الصالة</text><text x="600" y="719" font-family="Arial,sans-serif" text-anchor="middle" font-size="20" fill="#627176">مخطط توضيحي غير مقياسي • ليس تشخيصًا فنيًا</text></svg>