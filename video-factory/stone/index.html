<!doctype html>
<html lang="ar" data-resolution="portrait">
<head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>المسيليم | كتالوج بديل الحجر</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Tajawal;src:url('assets/Tajawal-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:Tajawal;src:url('assets/Tajawal-Bold.ttf') format('truetype');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f8f5ef;color:#05253b;font-family:Tajawal,sans-serif}
#root{position:relative;width:100%;height:100%;overflow:hidden}.canvas{position:absolute;inset:0;background:#f8f5ef}
.layout{direction:rtl;position:absolute;inset:170px 100px 240px;display:flex;flex-direction:column;gap:36px}
.brand{height:116px;display:flex;align-items:center;justify-content:space-between;direction:ltr}.brand img{width:300px;height:116px;object-fit:contain}.edition{direction:rtl;text-align:right;font-size:28px;line-height:1.6;color:#52616a;border-right:4px solid #af6037;padding-right:20px}
.title{padding-top:12px}.eyebrow{font-size:30px;color:#8a4828;margin:0 0 20px;font-weight:700}.title h1{font-size:82px;line-height:1.25;margin:0;letter-spacing:0;font-weight:700;max-width:880px}
.rule{height:3px;background:#d8c7b9;margin-top:28px}.rule-fill{height:100%;width:100%;background:#af6037;transform-origin:right center}
.hero{position:relative;height:630px;flex-shrink:0;margin-top:14px}.product{position:absolute;inset:0}.card{height:100%;display:flex;flex-direction:column;gap:0}.specimen{height:438px;display:flex;align-items:center;justify-content:center;background:#ede6db;border:2px solid #d6c9bb;padding:18px}.specimen img{width:100%;height:100%;object-fit:contain;display:block}.meta{display:flex;align-items:center;justify-content:space-between;padding:32px 0 24px;border-bottom:2px solid #d8c7b9;direction:rtl}.name{font-size:46px;font-weight:700;line-height:1.3}.code{font-size:50px;font-weight:700;direction:ltr;line-height:1.3}.model-label{font-size:26px;font-weight:400;margin-bottom:4px;color:#52616a}
.palette{display:flex;gap:18px;direction:ltr;height:116px;flex-shrink:0;margin-top:-6px}.thumb{flex:1;position:relative;background:#ede6db;padding:5px;border:2px solid #d6c9bb}.thumb img{width:100%;height:74px;object-fit:cover;display:block}.thumb-code{font-size:23px;text-align:center;line-height:28px;color:#05253b}.active{position:absolute;inset:-3px;border:4px solid #af6037;pointer-events:none}
.contact{padding-top:8px;text-align:right}.prompt{font-size:39px;line-height:1.35;margin:0 0 13px;font-weight:700}.phone-row{display:flex;justify-content:space-between;align-items:center;direction:rtl;gap:24px}.phone-label{font-size:29px}.phone{font-size:64px;font-weight:700;direction:ltr;line-height:1.1}.social{font-size:28px;color:#52616a;direction:ltr;text-align:right;margin:16px 0 0}.note{position:absolute;left:100px;right:100px;bottom:176px;text-align:right;font-size:24px;line-height:1.4;color:#52616a;margin:0}.progress{position:absolute;bottom:132px;right:100px;width:880px;height:4px;background:#dfd3c5}.progress-fill{height:100%;width:100%;background:#af6037;transform-origin:right center}
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
<div class="canvas"></div><main class="layout">
<header class="brand"><img src="assets/logo.png" alt="المسيليم للأصباغ والديكور"><div class="edition">كتالوج الخامات<div>بديل الحجر</div></div></header>
<div class="title"><p class="eyebrow">بديل الحجر في الكويت</p><h1 id="headline">النقشة تغيّر الجدار</h1><div class="rule"><div id="top-rule" class="rule-fill"></div></div></div>
<div class="hero"><section id="product-0" class="product clip" data-start="0" data-duration="4.5" data-track-index="1"><div id="card-0" class="card"><div class="specimen"><img src="assets/300-1.png" alt="بديل الحجر 300-1 أبيض"></div><div class="meta"><div><div class="model-label">اللون</div><div class="name">أبيض</div></div><div><div class="model-label">الموديل</div><div class="code">300-1</div></div></div></div></section><section id="product-1" class="product clip" data-start="4.5" data-duration="4.5" data-track-index="1"><div id="card-1" class="card"><div class="specimen"><img src="assets/300-2.png" alt="بديل الحجر 300-2 كريمي"></div><div class="meta"><div><div class="model-label">اللون</div><div class="name">كريمي</div></div><div><div class="model-label">الموديل</div><div class="code">300-2</div></div></div></div></section><section id="product-2" class="product clip" data-start="9" data-duration="6" data-track-index="1"><div id="card-2" class="card"><div class="specimen"><img src="assets/300-3A.png" alt="بديل الحجر 300-3A رمادي إسمنتي"></div><div class="meta"><div><div class="model-label">اللون</div><div class="name">رمادي إسمنتي</div></div><div><div class="model-label">الموديل</div><div class="code">300-3A</div></div></div></div></section></div>
<div class="palette"><div class="thumb"><img src="assets/300-1-thumb.png" alt=""><div class="thumb-code">300-1</div><div id="active-0" class="active clip" data-start="0" data-duration="4.5" data-track-index="2"></div></div><div class="thumb"><img src="assets/300-2-thumb.png" alt=""><div class="thumb-code">300-2</div><div id="active-1" class="active clip" data-start="4.5" data-duration="4.5" data-track-index="3"></div></div><div class="thumb"><img src="assets/300-3A-thumb.png" alt=""><div class="thumb-code">300-3A</div><div id="active-2" class="active clip" data-start="9" data-duration="6" data-track-index="4"></div></div></div>
<div class="contact"><p id="prompt" class="prompt">أي نقشة تناسب جدارك؟</p><div class="phone-row"><span class="phone-label">للاستفسار</span><span id="phone" class="phone">56510526</span></div><p class="social">@almusaileempaint</p></div>
</main><p class="note">اختيار اللون النهائي يكون على العينة الفعلية.</p><div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
</div>
<script>
document.fonts.ready.then(()=>{
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#headline',{y:20,opacity:0.7},{y:0,opacity:1,duration:0.55,ease:'power3.out'},0);
 tl.fromTo('#top-rule',{scaleX:0},{scaleX:1,duration:0.8,ease:'power2.out'},0.15);
 [0,4.5,9].forEach((t,i)=>{tl.fromTo('#card-'+i,{opacity:0.25,y:16},{opacity:1,y:0,duration:0.45,ease:'power2.out',immediateRender:false},t);});
 tl.fromTo('#progress-fill',{scaleX:0},{scaleX:1,duration:15,ease:'none'},0);
 tl.fromTo('#phone',{color:'#05253b'},{color:'#8a4828',duration:0.45},11.5);
 tl.fromTo('#prompt',{y:8},{y:0,duration:0.45,ease:'power2.out'},11.5);
 window.__timelines=window.__timelines||{};window.__timelines.main=tl;
});
</script></body></html>
